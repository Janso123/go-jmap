name: Go
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.27.x'
    - name: gofmt
      run: test -z "$(gofmt -l .)"
    - name: vet
      run: go vet ./...
    - name: test
      run: go test -race -count=1 ./...
    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.27.x'
    - name: vet
      run: go vet -tags e2e ./e2e/
    - name: test
      run: go test -tags e2e -count=1 -timeout 15m -v ./e2e/
    - name: upload report
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: e2e-report
        path: e2e/report.md
        if-no-files-found: ignore
