name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
      - name: test
        run: go test -tags e2e -count=1 -timeout 15m -v ./e2e/
      - name: upload report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-report
          path: e2e/report.md

  release:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.1
        with:
          name: e2e-report
          path: e2e

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          PRERELEASE_ARGS=()
          case "$TAG" in
            *alpha*|*beta*|*rc*) PRERELEASE_ARGS=(--prerelease) ;;
          esac

          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          PASS="$(sed -n 's/^- pass: //p' e2e/report.md)"
          FAIL="$(sed -n 's/^- fail: //p' e2e/report.md)"
          {
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then
              echo "Compared to \`$PREV\`:"
              echo
              git log --pretty=format:'- %s (%h)' "${PREV}..${TAG}"
              echo
            else
              echo "First tagged release — no previous tag to diff against."
              echo
              git log --pretty=format:'- %s (%h)' "$TAG"
              echo
            fi
            echo
            echo "<details>"
            echo "<summary>Stalwart e2e (pass ${PASS}, fail ${FAIL})</summary>"
            echo
            cat e2e/report.md
            echo
            echo "</details>"
          } > /tmp/release-notes.md

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            "${PRERELEASE_ARGS[@]}"
